syntax = "proto3";

option csharp_namespace = "CommerceHub.InventoryService";

package inventory;

service Inventory {

  rpc CheckAvailability (CheckAvailabilityRequest)
      returns (CheckAvailabilityResponse);

  rpc ReserveInventory (ReserveInventoryRequest)
      returns (ReserveInventoryResponse);

   rpc ReleaseInventory (ReleaseInventoryRequest)
    returns (ReleaseInventoryResponse);
}

message CheckAvailabilityRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckAvailabilityResponse {
  bool is_available = 1;
  int32 available_quantity = 2;
}

message ReserveInventoryRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveInventoryResponse {
  bool success = 1;
  int32 available_quantity = 2;
  int32 reserved_quantity = 3;
}

message ReleaseInventoryRequest {
    string product_id = 1;
    int32 quantity = 2;
}

message ReleaseInventoryResponse {
    bool success = 1;
    int32 available_quantity = 2;
    int32 reserved_quantity = 3;
}